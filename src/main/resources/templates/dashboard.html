<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Loan Dashboard</title>
</head>
<body>
    <h1>Loan Application Dashboard</h1>
    <h3>Total Applications: <span th:text="${totalCount}">0</span></h3>
    
    <table border="1">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Amount</th>
            <th>Type</th>
            <th>Status</th>
            <th>Date</th>
        </tr>
        <tr th:each="app : ${applications}">
            <td th:text="${app.id}">1</td>
            <td th:text="${app.applicantName}">John Doe</td>
            <td th:text="${app.amount}">1000</td>
            <td th:text="${app.loanType}">Personal</td>
            <td th:text="${app.status}">SUBMITTED</td>
            <td th:text="${app.submissionDate}">2026-01-01</td>
        </tr>
    </table>
</body>
</html>
